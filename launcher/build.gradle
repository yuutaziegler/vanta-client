plugins {
    id 'application'
    id 'java'
}

group = 'com.terentx'
version = '2.0.0'
archivesBaseName = 'TerentX-Launcher'

sourceCompatibility = JavaVersion.VERSION_17
targetCompatibility = JavaVersion.VERSION_17

repositories {
    mavenCentral()
}

dependencies {
    // No external dependencies for basic launcher
    // Add your preferred JSON library if needed
    // implementation 'com.google.code.gson:gson:2.10.1'
}

application {
    mainClass = 'com.terentx.launcher.TerentXLauncher'
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    manifest {
        attributes 'Main-Class': 'com.terentx.launcher.TerentXLauncher'
        attributes 'Implementation-Title': 'TerentX Launcher'
        attributes 'Implementation-Version': project.version
        attributes 'Implementation-Vendor': 'TerentX'
    }
}

tasks.register('createExe', Exec) {
    description = 'Creates Windows executable using launch4j (requires launch4j installed)'
    
    onlyIf {
        System.windows
    }
    
    doLast {
        // This would require launch4j configuration
        // For now, just print instructions
        println '''
            To create .exe:
            1. Download launch4j from https://sourceforge.net/projects/launch4j/
            2. Create launch4j.xml with your configuration
            3. Run: launch4j launch4j.xml
        '''
    }
}

task distZip(type: Zip) {
    dependsOn jar
    
    from('build/libs') {
        include '*.jar'
    }
    
    from('.') {
        include 'README.md'
        include 'start.sh'
        include 'start.bat'
    }
    
    archiveFileName = "TerentX-Launcher-${version}.zip"
    destinationDirectory = file('dist')
}

build.doLast {
    println """
    ========================================
        TerentX Launcher Build Complete!
    ========================================
    
    Version: ${version}
    Output:  build/libs/TerentX-Launcher-${version}.jar
    
    To run:
    - Java: java -jar build/libs/TerentX-Launcher-${version}.jar
    - Linux/Mac: ./start.sh
    - Windows: start.bat
    
    To create distribution:
    - Run: ./gradlew distZip
    
    ========================================
    """
}
